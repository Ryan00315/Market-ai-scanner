name: Update Market Data

on:
  schedule:
    # 台灣開盤時間 (週一至週五 台灣時間 09:00 ~ 14:00，每 5 分鐘更新一次)
    - cron: '*/5 1-6 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests numpy

      - name: Fetch Real Stock & Crypto Data
        run: |
          python scripts/update_market.py

      - name: Commit and Push Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git diff --staged --quiet || (git commit -m "chore: auto-update real market data [skip ci]" && git push)
