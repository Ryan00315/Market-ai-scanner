name: Scheduled Market Collector

on:
  schedule:
    - cron: '0 8,21 * * 1-5'  # 每天盤後自動跑
  workflow_dispatch:           # 允許手動在網頁點擊執行

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests yfinance google-genai pandas
      - name: Run script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python scripts/update_market.py
      - name: Commit and push changes
        run: |
          git config --global user.name "MarketBot"
          git config --global user.email "bot@github.com"
          git add data/market_data.json
          git commit -m "chore: update market snapshot & AI report" || exit 0
          git push
