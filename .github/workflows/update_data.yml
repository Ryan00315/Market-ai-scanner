name: Update Market Data

on:
  schedule:
    # 台灣時間週一至週五 09:00 ~ 13:30 (UTC 01:00 ~ 05:30) 每 30 分鐘自動更新一次
    - cron: '*/30 1-5 * * 1-5'
    # 收盤結算 15:30 (UTC 07:30) 跑一次
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Market Collector
        run: |
          python scripts/update_market.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git commit -m "chore: auto-update tradingview market data" || exit 0
          git push
