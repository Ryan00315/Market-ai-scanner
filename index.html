  <!-- ================= 註冊 / 登入彈窗 ================= -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 id="auth-modal-title" class="text-base font-bold text-white">會員登入</h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">電子信箱</label>
          <input type="email" id="auth-email" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-sky-500" placeholder="your@email.com" />

        <div>
          <label class="text-xs text-slate-400 block mb-1">密碼</label>
          <input type="password" id="auth-password" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-sky-500" placeholder="至少 6 位字元" />

  <script>
    // ================= 1. 安全降級架構（Firebase 設定） =================
    const firebaseConfig = {
      apiKey: "AIzaSyDUtSiVeBmq2Sr1Ny2x6oi0P3usZRR24nU",
      authDomain: "market-ai-radar-abc1c.firebaseapp.com",
      projectId: "market-ai-radar-abc1c",
      storageBucket: "market-ai-radar-abc1c.firebasestorage.app",
      messagingSenderId: "926851166318",
      appId: "1:926851166318:web:e9f313b120950e7f24f67f",
      measurementId: "G-RXWC5X2HMR"
    };

    let auth = null, db = null;
    let currentUser = null;
    let userWatchlist = JSON.parse(localStorage.getItem('user_watchlist') || '[]');

    // 判斷是否已設定好 Firebase
    const isFirebaseConfigured = Boolean(firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY");

    if (isFirebaseConfigured && typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();

        auth.onAuthStateChanged(user => {
          currentUser = user;
          if (user) {
            document.getElementById('guest-area').classList.add('hidden');
            document.getElementById('user-info-area').classList.remove('hidden');
            document.getElementById('user-email-display').textContent = user.email;
            loadCloudWatchlist(user.uid);
          } else {
            document.getElementById('guest-area').classList.remove('hidden');
            document.getElementById('user-info-area').classList.add('hidden');
            userWatchlist = JSON.parse(localStorage.getItem('user_watchlist') || '[]');
            renderCards();
          }
        });
      } catch (err) {
        console.warn("Firebase 初始化略過：", err);
      }
    }

    // ================= 2. 市場資料庫 =================
    const marketStore = {
      crypto: [
        { id: "BTCUSDT", type: "crypto", symbol: "BTC / USDT", name: "比特幣", price: "68,450.00", change: "+3.42%", isUp: true, badge: "突破 60MA",
          ai: { valuation: "動能擴張中", catalyst: "現貨 ETF 淨流入持續破億美元，微策略增持，長期籌碼鎖定率高。", fundamentals: "交易所存底創三年新低，資金費率處於中性健康區間。", bear: "64,000 (-6.5%)", base: "72,000 (+5.2%)", bull: "85,000 (+24.1%)" } },
        { id: "ETHUSDT", type: "crypto", symbol: "ETH / USDT", name: "以太坊", price: "2,620.10", change: "-0.85%", isUp: false, badge: "回測 20MA",
          ai: { valuation: "合理偏低", catalyst: "Layer 2 生態鎖倉量持續成長，全網質押比例穩居 28% 以上。", fundamentals: "短期匯率承壓，但結構性質押為下檔帶來扎實防守支撐。", bear: "2,400 (-8.4%)", base: "2,850 (+8.8%)", bull: "3,400 (+29.7%)" } },
        { id: "SOLUSDT", type: "crypto", symbol: "SOL / USDT", name: "Solana", price: "182.40", change: "+5.12%", isUp: true, badge: "帶量上攻",
          ai: { valuation: "強勢擴張", catalyst: "鏈上 DEX 交易量連續多週維持高位，生態熱度與開發者活躍度持續升高。", fundamentals: "手續費收入成長亮眼，技術均線維持陡峭多頭排列。", bear: "165 (-9.5%)", base: "205 (+12.3%)", bull: "240 (+31.5%)" } }
      ],
      tw: [
        { id: "2330", type: "tw", symbol: "2330", name: "台積電", price: "1,045.00", change: "+2.45%", isUp: true, badge: "多頭排列",
          ai: { valuation: "合理偏低 (2026e 22x)", catalyst: "先進封裝 CoWoS 產能持續翻倍，先進製程被各大客戶全面鎖死包下。", fundamentals: "毛利率持續站穩 55% 以上，資本支出調升，外資買盤回籠。", bear: "960 (-8.1%)", base: "1,120 (+7.1%)", bull: "1,250 (+19.6%)" } },
        { id: "2345", type: "tw", symbol: "2345", name: "智邦", price: "560.00", change: "-1.23%", isUp: false, badge: "均線整理",
          ai: { valuation: "合理估值", catalyst: "AI 算力中心轉型帶動高階交換器放量，代客購料降低讓毛利率回升。", fundamentals: "毛利率維持 20% 高檔，投信賣壓進入尾聲。", bear: "510 (-8.9%)", base: "590 (+5.3%)", bull: "660 (+17.8%)" } },
        { id: "2454", type: "tw", symbol: "2454", name: "聯發科", price: "1,310.00", change: "+1.95%", isUp: true, badge: "站上月線",
          ai: { valuation: "合理偏低", catalyst: "旗艦天璣晶片在終端旗艦手機滲透率創高，ASIC 特規晶片進展順利。", fundamentals: "現金股利殖利率具備吸引力，營收動能維持雙位數增長。", bear: "1,220 (-6.8%)", base: "1,400 (+6.8%)", bull: "1,550 (+18.3%)" } }
      ],
      us: [
        { id: "NVDA", type: "us", symbol: "NVDA", name: "NVIDIA", price: "138.25", change: "+3.80%", isUp: true, badge: "多頭走勢",
          ai: { valuation: "成長股評價 (Forward PE 32x)", catalyst: "新架構晶片量產出貨順利，各大雲端 CSP 資本支出維持向上無下修跡象。", fundamentals: "營收維持高雙位數成長，自由現金流充沛，庫藏股買回力道強勁。", bear: "120 (-13.2%)", base: "150 (+8.5%)", bull: "180 (+30.2%)" } },
        { id: "AAPL", type: "us", symbol: "AAPL", name: "Apple", price: "232.10", change: "+0.45%", isUp: true, badge: "高檔整理",
          ai: { valuation: "合理估值", catalyst: "Apple Intelligence 陸續拓展多國語系，換機週期預期將在明年發酵。", fundamentals: "服務營收佔比創新高，硬體毛利率保持穩定。", bear: "215 (-7.3%)", base: "245 (+5.5%)", bull: "270 (+16.3%)" } }
      ]
    };

    let currentTab = 'crypto';
    let currentWatchlistFilter = 'all';
    let isRegisterMode = false;
    let chartInstance = null;

    // ================= 3. 自選股同步邏輯 =================
    function loadCloudWatchlist(uid) {
      if (!db) return;
      db.collection('user_watchlists').doc(uid).get().then(doc => {
        if (doc.exists) {
          userWatchlist = doc.data().items || [];
        } else {
          saveWatchlist();
        }
        renderCards();
      }).catch(err => console.error("讀取雲端自選失敗：", err));
    }

    function saveWatchlist() {
      localStorage.setItem('user_watchlist', JSON.stringify(userWatchlist));
      if (currentUser && db) {
        db.collection('user_watchlists').doc(currentUser.uid).set({ items: userWatchlist }).catch(console.error);
      }
      renderCards();
    }

    function toggleWatchlist(id, event) {
      event.stopPropagation();
      if (userWatchlist.includes(id)) {
        userWatchlist = userWatchlist.filter(x => x !== id);
      } else {
        userWatchlist.push(id);
      }
      saveWatchlist();
    }

    // ================= 4. 分頁與卡片渲染 =================
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.remove('nav-active');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) {
        activeBtn.classList.add('nav-active');
        activeBtn.classList.remove('text-slate-400');
      }

      const titleMap = { crypto: '⚡ 加密貨幣市場', tw: '📊 台股市場掃描', us: '🇺🇸 美股市場掃描', watchlist: '⭐ 我的自選標的' };
      document.getElementById('page-title').textContent = titleMap[tab];

      const wSubtabs = document.getElementById('watchlist-subtabs');
      if (tab === 'watchlist') {
        wSubtabs.classList.remove('hidden');
      } else {
        wSubtabs.classList.add('hidden');
      }
      renderCards();
    }

    function filterWatchlist(type) {
      currentWatchlistFilter = type;
      ['all', 'tw', 'us', 'crypto'].forEach(t => {
        const btn = document.getElementById(`wtab-${t}`);
        if (btn) {
          btn.className = (t === type)
            ? "px-2.5 py-1 rounded bg-slate-800 text-white font-medium"
            : "px-2.5 py-1 rounded text-slate-400 hover:text-white";
        }
      });
      renderCards();
    }

    function renderCards() {
      // 統計各分類數量
      document.getElementById('badge-crypto').textContent = marketStore.crypto.length;
      document.getElementById('badge-tw').textContent = marketStore.tw.length;
      document.getElementById('badge-us').textContent = marketStore.us.length;
      document.getElementById('badge-fav').textContent = userWatchlist.length;

      let displayList = [];
      const allItems = [...marketStore.crypto, ...marketStore.tw, ...marketStore.us];

      if (currentTab === 'watchlist') {
        displayList = allItems.filter(item => userWatchlist.includes(item.id));
        if (currentWatchlistFilter !== 'all') {
          displayList = displayList.filter(item => item.type === currentWatchlistFilter);
        }
      } else {
        displayList = marketStore[currentTab] || [];
      }

      const q = document.getElementById('search-input').value.trim().toLowerCase();
      if (q) {
        displayList = displayList.filter(item => item.symbol.toLowerCase().includes(q) || item.name.toLowerCase().includes(q));
      }

      const container = document.getElementById('cards-container');
      const emptyState = document.getElementById('empty-state');

      if (displayList.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      container.innerHTML = displayList.map(item => {
        const isFav = userWatchlist.includes(item.id);
        const dataStr = encodeURIComponent(JSON.stringify(item));
        return `
          <div onclick="handleCardClick('${dataStr}')" class="bg-slate-900 border border-slate-800 hover:border-slate-700 hover:bg-slate-850 p-5 rounded-xl cursor-pointer transition flex flex-col justify-between group">
            <div class="flex items-start justify-between">
              <div>
                <div class="text-xs font-mono text-slate-400">${item.symbol}</div>
                <div class="text-lg font-bold text-white mt-0.5 group-hover:text-sky-400 transition">${item.name}</div>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">${item.badge}</span>
                <button onclick="toggleWatchlist('${item.id}', event)" class="p-1 rounded text-base transition ${isFav ? 'text-amber-400' : 'text-slate-600 hover:text-slate-300'}">
                  ${isFav ? '★' : '☆'}
                </button>
              </div>
            </div>
            <div class="flex items-end justify-between mt-6">
              <div>
                <div class="text-[11px] text-slate-500">現價</div>
                <div class="text-xl font-mono font-bold text-slate-100">${item.price}</div>
              </div>
              <div class="text-right">
                <div class="text-[11px] text-slate-500">漲跌幅</div>
                <div class="text-base font-mono font-semibold ${item.isUp ? 'text-emerald-400' : 'text-rose-400'}">${item.change}</div>
              </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
              <span>AI 估值：<span class="text-slate-200">${item.ai.valuation}</span></span>
              <span class="text-sky-400">點擊查看報告 →</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleSearch() {
      renderCards();
    }

    function handleCardClick(encodedStr) {
      const item = JSON.parse(decodeURIComponent(encodedStr));
      openDetailModal(item);
    }

    // ================= 5. K 線圖與 AI 報告彈窗（解決圖表空白關鍵） =================
    function openDetailModal(item) {
      document.getElementById('modal-title').textContent = `${item.name} (${item.symbol})`;
      document.getElementById('modal-subtitle').textContent = `現價：${item.price} ｜ 漲跌幅：${item.change}`;
      document.getElementById('ai-valuation').textContent = item.ai.valuation;
      document.getElementById('ai-catalyst').textContent = item.ai.catalyst;
      document.getElementById('ai-fundamentals').textContent = item.ai.fundamentals;
      document.getElementById('ai-bear').textContent = item.ai.bear;
      document.getElementById('ai-base').textContent = item.ai.base;
      document.getElementById('ai-bull').textContent = item.ai.bull;

      // 步驟 1：先讓彈跳視窗解除隱藏（讓 DOM 具備寬高）
      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');

      // 步驟 2：延遲一個 frame 初始化圖表，保證抓到容器像素寬度
      setTimeout(() => {
        const chartContainer = document.getElementById('chart-container');
        chartContainer.innerHTML = ''; // 清空舊圖表

        if (typeof LightweightCharts === 'undefined') {
          chartContainer.innerHTML = '<div class="text-center py-24 text-rose-400 text-xs">圖表套件載入中，請重新嘗試</div>';
          return;
        }

        chartInstance = LightweightCharts.createChart(chartContainer, {
          width: chartContainer.clientWidth,
          height: 320,
          layout: { background: { color: '#090d16' }, textColor: '#94a3b8' },
          grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
          timeScale: { borderColor: '#334155' }
        });

        // 台股套用紅漲綠跌，其餘套用綠漲紅跌
        const isTw = item.type === 'tw';
        const upColor = isTw ? '#ef4444' : '#10b981';
        const downColor = isTw ? '#10b981' : '#ef4444';

        const candleSeries = chartInstance.addCandlestickSeries({
          upColor: upColor, downColor: downColor, borderVisible: false,
          wickUpColor: upColor, wickDownColor: downColor
        });

        const ma20 = chartInstance.addLineSeries({ color: '#38bdf8', lineWidth: 1.5 });
        const ma60 = chartInstance.addLineSeries({ color: '#f97316', lineWidth: 1.5 });

        // 生成 90 日擬真 K 線資料
        let base = parseFloat(item.price.replace(/,/g, '')) * 0.9;
        const candles = [];
        const now = new Date();
        for (let i = 90; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          const delta = (Math.random() - 0.48) * (base * 0.03);
          const open = base;
          const close = base + delta;
          candles.push({
            time: d.toISOString().split('T')[0],
            open: parseFloat(open.toFixed(2)),
            high: parseFloat((Math.max(open, close) + Math.random() * (base * 0.015)).toFixed(2)),
            low: parseFloat((Math.min(open, close) - Math.random() * (base * 0.015)).toFixed(2)),
            close: parseFloat(close.toFixed(2))
          });
          base = close;
        }

        candleSeries.setData(candles);

        const calcMA = (p) => candles.slice(p - 1).map((_, i) => ({
          time: candles[i + p - 1].time,
          value: parseFloat((candles.slice(i, i + p).reduce((a, b) => a + b.close, 0) / p).toFixed(2))
        }));

        ma20.setData(calcMA(20));
        ma60.setData(calcMA(60));
        chartInstance.timeScale().fitContent();
      }, 50);
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      if (chartInstance) {
        chartInstance.remove();
        chartInstance = null;
      }
    }

    // ================= 6. 註冊 / 登入功能 =================
    function openAuthModal() {
      document.getElementById('auth-modal').classList.remove('hidden');
    }
    function closeAuthModal() {
      document.getElementById('auth-modal').classList.add('hidden');
    }
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-modal-title').textContent = isRegisterMode ? '註冊新帳號' : '會員登入';
      document.getElementById('auth-submit-btn').textContent = isRegisterMode ? '立即註冊' : '登入';
      document.getElementById('auth-toggle-btn').textContent = isRegisterMode ? '已有帳號？前往登入' : '還沒有帳號？免費註冊';
    }

    function submitAuth() {
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-password').value.trim();
      const errBox = document.getElementById('auth-error');
      errBox.classList.add('hidden');

      if (!isFirebaseConfigured || !auth) {
        // 若尚未設定 Firebase，提供友善通知並示範訪客模擬登入
        alert("目前運行於本機訪客模式！您的自選股已自動安全儲存在此瀏覽器中。\n\n若需跨裝置雲端同步，請在 index.html 填入您申請的 Firebase 金鑰參數。");
        closeAuthModal();
        return;
      }

      const promise = isRegisterMode ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass);
      promise.then(() => {
        closeAuthModal();
      }).catch(err => {
        errBox.textContent = "操作失敗：" + err.message;
        errBox.classList.remove('hidden');
      });
    }

    function handleLogout() {
      if (auth) auth.signOut();
    }

    // 啟動首次渲染
    renderCards();
  </script>
</body>
</html>
